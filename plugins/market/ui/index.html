<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>插件市场</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">
  <header class="head">
    <div class="titles">
      <h1>插件市场 <small id="ver"></small></h1>
      <p class="sub" id="sub">发现社区为 M-Harness 打造的能力</p>
    </div>
    <div class="head-actions">
      <button class="pill ghost" id="refresh" title="重新拉取目录">刷新</button>
      <button class="pill ghost" id="export-log">导出日志</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab on" role="tab" data-tab="discover">发现</button>
    <button class="tab" role="tab" data-tab="themes">主题</button>
    <button class="tab" role="tab" data-tab="favorites">收藏</button>
    <button class="tab" role="tab" data-tab="installed">已安装</button>
    <button class="tab" role="tab" data-tab="hidden">已屏蔽</button>
    <button class="tab" role="tab" data-tab="advanced">备份与来源</button>
  </nav>

  <div id="notice"></div>

  <section id="browse">
    <div class="searchbar">
      <label class="search"><span class="ico-s" id="ico-search"></span><input id="q" type="search" placeholder="搜索插件，例如：记忆、终端、通知…" autocomplete="off" /></label>
      <button class="pill ghost" id="filter-btn" aria-expanded="false">筛选 <span class="car">▾</span></button>
    </div>
    <div class="filters" id="filters" hidden>
      <label>类型 <select class="dbx-select" id="kind"><option value="">全部</option><option value="dbx">DBX（可直接安装）</option><option value="dsh">DSH（仅浏览）</option></select></label>
      <label>排序 <select class="dbx-select" id="sort"><option value="">默认</option><option value="stars">按星标</option><option value="updated">按最近更新</option><option value="name">按名称</option></select></label>
      <label>来源 <select class="dbx-select" id="source"><option value="">全部</option></select></label>
    </div>
    <div class="subtabs" id="subtabs" hidden></div>
    <div class="caps" id="caps"></div>
    <div id="recent"></div>
    <div id="grid" class="grid"><div class="hint pad">加载中…</div></div>
    <div id="more" class="more"></div>
  </section>

  <section id="advanced" hidden></section>
</div>

<div id="modal" class="modal" hidden><div class="dlg" id="dlg"></div></div>
<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
