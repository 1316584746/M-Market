<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M-Market 插件市场</title>
<meta name="description" content="M-Harness 的插件市场：官方 DBX 插件加上社区 DSH 插件索引，可搜索、可筛选。" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header>
  <h1>M-Market <small>插件市场</small></h1>
  <p id="meta" class="hint">加载中…</p>
</header>
<section class="bar">
  <input id="q" type="search" placeholder="搜索：名称、作者、标签…" autofocus />
  <select id="kind"><option value="">全部类型</option><option value="dbx">DBX 插件（M-Harness 可一键安装）</option><option value="dsh">DSH 插件（社区索引）</option></select>
  <select id="cat"><option value="">全部分类</option></select>
  <select id="sort"><option value="stars">按星标</option><option value="updated">按最近更新</option><option value="name">按名称</option></select>
</section>
<main id="grid"></main>
<nav id="pager"></nav>
<footer class="hint">
  在 M-Harness 里装：打开「插件市场」插件，或在「插件中心」添加仓库 <code>1316584746/M-Market</code>。DSH 条目来自社区索引，仅供浏览，装之前请自己看一眼源码。
  <span id="updated"></span>
</footer>
<script src="app.js"></script>
</body>
</html>
